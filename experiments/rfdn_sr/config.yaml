model:
  type: VISION_SR
  name: RFDN
  cpt_url: "file://data/models/RFDN_AIM.pth"
  params:
    scale: 4

training:
  criterion: L1Loss
  optimizer: RAdam
  max_epochs: 1000
  val_every_n_epochs: 1
  log_every_n_steps: 10
  callbacks:
    PrintSrMetrics:
      params:
        rank_zero_only: true
    NoiseEarlyStopping:
      params:
        monitor: PSNR/Weighted_mean
        mode: max
        patience: 1000
        min_delta: 0.00005
    NoiseModelCheckpoint:
      params:
        monitor: PSNR/Weighted_mean
        mode: max
        filename: gdnsq_checkpoint-{epoch:02d}-"{PSNR/Weighted_mean:.4f}"
    TemperatureScale:
      params:
        scale_lr: 1
        scale_anneal: 0.9999
        warmup: 500


data:
  dataset_name: SR
  data_dir: ./data/
  batch_size: 24
  num_workers: 8
  params:
    denormalize: True
    to_luminance: True


quantization:
  name: GDNSQQuant
  quantize_bias: False
  qscheme: 1 # 0 for per-tensor, 1 for per-channel
  act_bit: 4
  weight_bit: 4
  excluded_layers:
    - 'fea_conv'
    - 'upsampler.0'
  calibration:
    act_bit: 10
    weight_bit: 10
  params:
    distillation: True
    distillation_loss: L1
    qnmethod: STE
